name: macOS App Build (personal)

# Builds a silo-apple repository's SiloMac target unsigned on a GitHub-hosted macOS runner, ad-hoc
# signs it, and publishes the zipped app as an artifact and a prerelease.
# A fork with fork/apply-brand.sh is built under its own brand.
# No Apple Developer account is used, so on first launch macOS Gatekeeper
# needs: right-click Silo.app > Open, or `xattr -cr /Applications/Silo.app`.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'silo-apple repository to build'
        default: Joloxx9/silo-apple
      ref:
        description: 'Branch, tag or commit to build'
        default: fork-build

concurrency:
  group: mac-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen

      - name: Apply the fork's brand
        run: |
          if [ -x fork/apply-brand.sh ]; then fork/apply-brand.sh personal; fi

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build SiloMac (Release, unsigned)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project Silo.xcodeproj \
            -scheme SiloMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="1.1.0" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0 || { tail -200 "$RUNNER_TEMP/build.log"; exit 1; }

      - name: Ad-hoc sign and zip
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release/Silo.app"
          test -d "$APP"
          if [ -f fork/brand.env ]; then
            . fork/brand.env
            mv "$APP" "$(dirname "$APP")/$APP_NAME.app"
            APP="$(dirname "$APP")/$APP_NAME.app"
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p out
          ditto -c -k --keepParent "$APP" out/macOS-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-app
          path: out/macOS-app.zip
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/macOS-app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --title "macOS app (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned (ad-hoc) personal build of the SiloMac target from ${{ inputs.repository }}@${{ inputs.ref }}. Unzip, move the app to Applications, then run: xattr -cr /Applications/<App>.app"
