name: Sideload IPA Build (personal)

# Builds unsigned iOS and tvOS IPAs of a silo-apple repository with its own
# fastlane lanes, and publishes them as a prerelease. The IPAs must be
# re-signed before install (Xcode on a Mac for tvOS; AltStore / Sideloadly /
# SideStore for iOS).

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'silo-apple repository to build'
        default: Silo-Server/silo-apple
      ref:
        description: 'Branch, tag or commit to build'
        default: main
      version:
        description: 'Marketing version'
        default: '1.1.0'
      platform:
        description: 'Which platform(s) to build'
        type: choice
        default: both
        options: [both, ios, tvos]

concurrency:
  group: sideload-ipa
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - id: set
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          ios='{"platform":"iOS","lane":"ipa_ios_unsigned","ipa_path":"build/ios-unsigned/Silo-unsigned.ipa"}'
          tvos='{"platform":"tvOS","lane":"ipa_tvos_unsigned","ipa_path":"build/tvos-unsigned/SiloTV-unsigned.ipa"}'
          case "$PLATFORM" in
            ios)  include="[$ios]" ;;
            tvos) include="[$tvos]" ;;
            *)    include="[$ios,$tvos]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SRC: ${{ inputs.repository }}@${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "bad version: $VERSION"; exit 1; }
          TAG="ipa-v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --prerelease \
            --title "Silo iOS/tvOS v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned iOS/tvOS IPAs from ${SRC}. Re-sign before installing."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./src/.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: src
          bundler-cache: true

      - name: Apply the fork's brand
        run: |
          if [ -x fork/apply-brand.sh ]; then fork/apply-brand.sh personal; fi

      # The runner's Xcode is not the one silo-apple pins, so its resolver
      # disagrees with the committed Package.resolved. Let it resolve.
      - name: Allow package resolution on this Xcode
        run: |
          sed -i '' 's/%w\[-disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile\]/%w[]/' fastlane/Fastfile
          sed -i '' 's/"-resolvePackageDependencies", "-disableAutomaticPackageResolution",/"-resolvePackageDependencies"]/; /^          "-onlyUsePackageVersionsFromResolvedFile"\]$/d' fastlane/Fastfile
          sed -n '105,120p' fastlane/Fastfile

      - name: Build unsigned ${{ matrix.platform }} IPA
        run: bundle exec fastlane ios ${{ matrix.lane }}
        env:
          MARKETING_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-unsigned-ipa
          path: src/${{ matrix.ipa_path }}
          if-no-files-found: error

      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          IPA: ${{ matrix.ipa_path }}
        run: gh release upload "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
